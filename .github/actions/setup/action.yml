name: Setup
description: Installe Node et les dépendances npm

inputs:
  node-version:
    description: Version de Node
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
