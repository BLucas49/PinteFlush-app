name: CI

on:
  push:
    # branches: [dev, main]
    branches: [disabled]
  pull_request:
    branches: [disabled]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
